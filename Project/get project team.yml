info:
  name: get project team
  type: http
  seq: 17

http:
  method: POST
  url: "{{base_url}}/api/projects/22/team"
  body:
    type: json
    data: |-
      {
        "rangePreset":"ThisWeek",
        "sortBy":"NameAsc",
        "utilizationUnit":"Percent",
        "anchorDate":"2026-09-09"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
