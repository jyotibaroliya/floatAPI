info:
  name: get team holidays
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/time-off/team-holidays?year=2026"
  params:
    - name: year
      value: "2026"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
