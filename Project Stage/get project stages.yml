info:
  name: get project stages
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/projects/stages"
  params:
    - name: includeArchived
      value: "true"
      type: query
      disabled: true
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
